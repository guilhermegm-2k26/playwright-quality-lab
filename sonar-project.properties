# SONAR_PROJECT_KEY e SONAR_ORGANIZATION são fornecidos pelo GitHub Actions.
sonar.host.url=https://sonarcloud.io
sonar.projectName=Playwright Quality Lab
sonar.projectVersion=1.0
# Este repositório contém automação E2E, não o código das aplicações testadas.
sonar.sources=.github
sonar.tests=src
sonar.test.inclusions=**/*.ts
sonar.sourceEncoding=UTF-8
